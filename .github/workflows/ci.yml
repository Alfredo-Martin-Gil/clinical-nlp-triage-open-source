name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "c1-r1-credibility-repair"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  baseline_smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline smoke
        run: |
          python src/rules_engine.py \
            --notes data/notes_synthetic.csv \
            --lexicon data/lexicon_redflags.csv \
            --out outputs/predictions.csv

      - name: Reproduce synthetic evaluation
        run: |
          python scripts/evaluate_synthetic_baseline.py \
            --predictions outputs/predictions.csv \
            --json-out outputs/synthetic_metrics.json \
            --entity-csv outputs/synthetic_by_entity.csv \
            --errors-csv outputs/synthetic_errors.csv

      - name: Verify interpretation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("outputs/synthetic_metrics.json").read_text())
          assert metrics["dataset_type"] == "synthetic"
          assert metrics["n"] == 180
          assert "not clinical validation" in metrics["interpretation_boundary"].lower()
          PY
